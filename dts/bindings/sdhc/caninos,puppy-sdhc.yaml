description: Puppy SDHC Controller

compatible: "caninos,puppy-sdhc"

include: [sdhc.yaml]

properties:
  clock-frequency:
    type: int
    description: clock-frequency for SDHC
  reg:
    required: true
    description: register space
  
  pwr-gpios:
    type: phandle-array
    description: |
      Power pin
      This is a configurable pin to deliver power supply to the SD card.
      It is configured as a GPIO in order to execute power toggles and
      reinitialize the SD slave when necessary.

  dat0-gpios:
    type: phandle-array
    required: true
    description: |
      DAT0 pin
      dat0 pin to check if the device is busy.