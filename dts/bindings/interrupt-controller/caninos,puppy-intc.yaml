description: RISC-V CPU interrupt controller

compatible: "caninos,puppy-intc"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true
  "#interrupt-cells":
    const: 1

interrupt-cells:
  - irq
